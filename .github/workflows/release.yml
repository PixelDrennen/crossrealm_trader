name: Test and release Linux app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/app.js
      - run: python3 -m unittest discover -s test -p "*_test.py"
      - run: bash -n install.sh
  release:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - name: Resolve release version
        id: version
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$VERSION" ]]; then exit 1; fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.exists == 'false'
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach installer and verified assets
        if: steps.version.outputs.exists == 'false'
        run: |
          cp install.sh dist/install.sh
          cp build/icon.png dist/crossrealm-trader.png
          cd dist
          sha256sum *.AppImage *.rpm crossrealm-trader.png install.sh > SHA256SUMS
          gh release upload "${{ steps.version.outputs.tag }}" install.sh crossrealm-trader.png SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
